<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="author" content="Maria Valle"/><meta name="description" content="Spots, card profile, card content, cards, footer."/><meta name="keywords" content="Spots, profile, content, cards"/><link rel="shortcut icon" href="favicon.ico" type="image/x-icon"/><title>Spots</title><link rel="icon" href="favicon.ico"><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img src="e793829a1f9e21f462b1.svg" alt="Spot logo" class="header__logo"/></header><main class="content"><section class="profile page__section"><div class="profile__avatar-container"><button class="profile__avatar-btn"><img class="profile__pencil-icon" src="466fba40d06de23ed0a1.svg" alt="Pencil icon"/></button> <img src="2fc47fd8e9a9bcd9612f.jpg" alt="Bessie Coleman avatar" class="profile__avatar"/></div><div class="profile__column"><h1 class="profile__name">Bessie Coleman</h1><p class="profile__description">Civil Aviator</p><button type="button" class="profile__edit-btn"><img src="d38272e02bb4f1ab1c37.svg" alt="Pencil icon"/>Edit Profile</button></div><button type="button" class="profile__add-btn"><img src="40608da7369d39bc1077.svg" alt="Plus icon"/> New Post</button></section><section class="cards page__section"><ul class="cards__list"><template id="card-template"><li class="card"><button aria-label="Delete card" class="card__delete-button" type="button"></button> <img class="card__image" src="#" alt=""/><div class="card__content"><h2 class="card__title"></h2><button aria-label="Like card" type="button" class="card__like-button"></button></div></li></template></ul></section></main><footer class="footer"><p class="footer__copyright">2024&copy;Spots</p></footer></div><div class="modal" id="edit-profile-modal"><div class="modal__container"><button aria-label="Close modal" type="button" class="modal__close-btn"></button><h2 class="modal__title">Edit profile</h2><form class="modal__form" novalidate><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input" class="modal__input" placeholder="Type your name" minlength="2" maxlength="40" required/> <span id="profile-name-input-error" class="modal__error"></span></label> <label for="profile-description-input" class="modal__label">Description <input id="profile-description-input" class="modal__input" placeholder="Describe yourself" minlength="2" maxlength="200" required/> <span id="profile-description-input-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal" id="new-post-modal"><div class="modal__container"><button aria-label="Close modal" type="button" class="modal__close-btn"></button><h2 class="modal__title">New Post</h2><form class="modal__form" novalidate><label for="card-image-input" class="modal__label">Image Link <input id="card-image-input" type="url" class="modal__input" placeholder="Place a link to the picture" required/> <span id="card-image-input-error" class="modal__error"></span></label> <label for="type-caption-input" class="modal__label">Caption <input id="type-caption-input" class="modal__input" placeholder="Type your caption" minlength="2" maxlength="30" required/> <span id="type-caption-input-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal modal_type_preview" id="preview-modal"><div class="modal__image-container"><button aria-label="Close Modal" type="button" class="modal__close-btn modal__close-btn_type_preview"></button> <img src="#" alt="" class="modal__image"/><p class="modal__caption"></p></div></div><div class="modal" id="edit-avatar-modal"><div class="modal__container"><button aria-label="Close modal" type="button" class="modal__close-btn"></button><h2 class="modal__title">Edit
